<script>
async function loadPosts() {
    const container = document.getElementById('blog-list');
    
    // Updated query pointing directly to host "mitgh.hashnode.dev"
    const query = `
        query {
            publication(host: "mitgh.hashnode.dev") {
                posts(first: 10) {
                    edges {
                        node {
                            title
                            brief
                            url
                            publishedAt
                        }
                    }
                }
            }
        }
    `;

    try {
        const response = await fetch('https://gql.hashnode.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query })
        });
        
        const resData = await response.json();
        const posts = resData?.data?.publication?.posts?.edges || [];

        if (posts.length === 0) {
            container.innerHTML = '<p class="muted">No posts found on Hashnode.</p>';
            return;
        }

        container.innerHTML = posts.map(item => {
            const post = item.node;
            const date = post.publishedAt ? post.publishedAt.split('T')[0] : '';
            return `
                <article class="blog-preview">
                    <time>${date}</time>
                    <h3><a href="${post.url}" target="_blank" rel="noopener">${post.title}</a></h3>
                    <p>${post.brief}</p>
                </article>
            `;
        }).join('');

    } catch (e) {
        container.innerHTML = '<p class="muted">Read articles directly on <a href="https://mitgh.hashnode.dev" target="_blank">Hashnode</a>.</p>';
    }
}

loadPosts();
</script>
