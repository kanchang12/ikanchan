<nav>

<div class="blog-post">
    <h1>Blog</h1>
    <p class="blog-post-meta">Writing about Android app development, AI systems, and software architecture.</p>
    <div id="blog-list"></div>
</div>

<footer>
    <p>LOVEUAD LTD · Leeds, UK · Company No. 16838046</p>
</footer>

<script>
async function loadPosts() {
    const container = document.getElementById('blog-list');
    const rssUrl = 'https://hashnode.com/@mitgh/rss.xml';
    const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

    try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok' && data.items && data.items.length > 0) {
            container.innerHTML = data.items.map(post => {
                const date = post.pubDate ? post.pubDate.split(' ')[0] : '';
                
                // Strip HTML tags to extract a clean excerpt
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = post.description;
                const excerpt = (tempDiv.textContent || tempDiv.innerText || '').substring(0, 200) + '...';

                return `
                    <article class="blog-preview">
                        <time>${date}</time>
                        <h3><a href="${post.link}" target="_blank" rel="noopener">${post.title}</a></h3>
                        <p>${excerpt}</p>
                    </article>
                `;
            }).join('');
        } else {
            container.innerHTML = '<p class="muted">No posts yet on Hashnode.</p>';
        }
    } catch (e) {
        container.innerHTML = '<p class="muted">Unable to load posts from Hashnode right now.</p>';
    }
}
loadPosts();
</script>
