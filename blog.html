<body>

<nav>
    <div class="nav-inner">
        <a href="/" class="nav-name">Kanchan Ghosh</a>
        <div class="nav-links">
            <a href="/#books">Books</a>
            <a href="/#code">Code</a>
            <a href="blog.html">Blog</a>

        </div>

<div class="blog-post">
    <h1>Blog</h1>
    <p class="blog-post-meta">Writing about dark fantasy, AI tools, and indie publishing.</p>
    <div id="blog-list"></div>
</div>

<footer>
    <p>LOVEUAD LTD · Leeds, UK · Company No. 16838046</p>
</footer>

<script>
async function loadPosts() {
    try {
        const response = await fetch('blog/posts.json');
        const posts = await response.json();
        const container = document.getElementById('blog-list');
        if (posts.length === 0) {
            container.innerHTML = '<p class="muted">No posts yet.</p>';
            return;
        }
        container.innerHTML = posts.map(post => `
            <article class="blog-preview">
                <time>${post.date}</time>
                <h3><a href="blog/${post.slug}.html">${post.title}</a></h3>
                <p>${post.excerpt}</p>
            </article>
        `).join('');
    } catch (e) {
        document.getElementById('blog-list').innerHTML = '<p class="muted">No posts yet.</p>';
    }
}
loadPosts();
</script>

</body>
